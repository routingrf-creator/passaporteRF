<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
</head>
<body style="margin:0;padding:0;background-color:#f8f6f3;font-family:Arial,Helvetica,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background-color:#f8f6f3;padding:32px 0;">
    <tr>
      <td align="center">
        <table width="600" cellpadding="0" cellspacing="0" style="background-color:#ffffff;border-radius:16px;overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,0.06);">

          <!-- Header -->
          <tr>
            <td style="background: linear-gradient(135deg, #1e6faf, #0f3d5c);padding:32px 40px;text-align:center;">
              <h1 style="margin:0;font-size:22px;color:#ffffff;letter-spacing:0.5px;">PassaporteRF</h1>
              <p style="margin:8px 0 0;font-size:13px;color:rgba(255,255,255,0.7);">{{subject}}</p>
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td style="padding:32px 40px;">
              <h2 style="margin:0 0 20px;font-size:18px;color:#0f3d5c;">{{subject}}</h2>

              <div style="padding:12px 16px;background-color:#f0f7ff;border-radius:8px;margin-bottom:20px;">
                <p style="margin:0 0 2px;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#888;">Remetente</p>
                <p style="margin:0;font-size:15px;color:#1e6faf;font-weight:600;">{{from_email}}</p>
              </div>

              <div style="padding:16px;background-color:#f8f6f3;border-left:4px solid #e8604c;border-radius:0 8px 8px 0;">
                <p style="margin:0;font-size:14px;color:#333;line-height:1.8;white-space:pre-line;">{{body}}</p>
              </div>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="padding:20px 40px;background-color:#f8f6f3;text-align:center;border-top:1px solid #eee;">
              <p style="margin:0;font-size:12px;color:#999;">Este email foi enviado automaticamente pelo site PassaporteRF</p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
